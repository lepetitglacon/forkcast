# Production stack for Dokploy (Docker Compose deployment from the Git repository).
# Only the `web` service gets a domain in Dokploy (port 80): its nginx serves the front and
# proxies /api, /collab (WebSocket), /mcp and the OAuth routes to `server`, so everything
# lives on ONE origin. No port is published: MongoDB and the API stay on the internal network.
#
# Environment variables to set in Dokploy (Environment tab):
#   PUBLIC_URL=https://forkcast.example.com   (exact public URL, used as OAuth issuer)
#   JWT_SECRET=<long random string>            (e.g. `openssl rand -hex 32`)
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/forkcast
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}
      WEB_URL: ${PUBLIC_URL}
      COLLAB_DEBOUNCE: 2000
      MCP_RATE_LIMIT: 120
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ''
        VITE_WS_URL: ''
        VITE_KOFI_URL: ${VITE_KOFI_URL:-}
        VITE_REPO_URL: ${VITE_REPO_URL:-}
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - '80'

volumes:
  mongo-data:
