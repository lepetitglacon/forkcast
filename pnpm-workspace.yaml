packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': true
  esbuild: true
  mongodb-memory-server: true
  unrs-resolver: false

catalog:
  typescript: 5.9.3
  "@types/node": ^24.0.0
  zod: ^4.6.5
  yjs: ^13.6.33
  y-protocols: ^1.0.7
  nanoid: ^3.3.19
  vitest: ^5.0.3
  tsup: ^8.5.1
  react: ^18.3.1
  react-dom: ^18.3.1
  "@types/react": ^18.3.31
  "@types/react-dom": ^18.3.7
  "@hocuspocus/server": ^4.7.0
  "@hocuspocus/provider": ^4.7.0
  "@hocuspocus/extension-database": ^4.7.0
  "@modelcontextprotocol/sdk": ^1.31.0

minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.2'
  - '@nestjs/core@12.1.2'
  - '@nestjs/platform-express@12.1.2'
  - '@nestjs/testing@12.1.2'
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - globals@17.13.0
  - turbo@2.11.6
  - vitest@5.0.3
